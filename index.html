<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backgammon</title>
<!-- Item 5: favicon. A data-URI <link rel="icon"> means the browser never
     issues an implicit GET /favicon.ico against whatever static host is
     serving this file (this server is WS-only -- see transport/server.py --
     so that implicit request 404s with nothing here to fall back to). -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%236b3f1d'/%3E%3Ccircle cx='11' cy='11' r='5.5' fill='%23f4ecd8' stroke='%23111' stroke-width='1.2'/%3E%3Ccircle cx='21' cy='21' r='5.5' fill='%232a2118' stroke='%23111' stroke-width='1.2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body data-status="connecting">

  <header class="topbar">
    <h1>Backgammon</h1>
    <div class="score">
      <span class="score-label">White</span>
      <span data-series="white" class="score-value">0</span>
      <span class="score-sep">&ndash;</span>
      <span data-series="black" class="score-value">0</span>
      <span class="score-label">Black</span>
    </div>
    <div class="turn-indicator" data-turn-indicator hidden>
      <span class="turn-indicator-dot" data-turn-indicator-dot></span>
      <span data-turn-indicator-copy></span>
    </div>
    <div class="seat-badge" data-seat></div>
  </header>

  <div class="connection-banner" data-conn-banner>
    <span data-conn-copy>Connecting&hellip;</span>
    <button type="button" data-action="retry" class="retry-btn" hidden>Retry</button>
  </div>

  <main class="table-wrap">
    <div class="board" data-board>
      <!-- top half: points 13-24 left to right -->
      <div class="quadrant top-left">
        <div class="point point-top" data-point="13"></div>
        <div class="point point-top" data-point="14"></div>
        <div class="point point-top" data-point="15"></div>
        <div class="point point-top" data-point="16"></div>
        <div class="point point-top" data-point="17"></div>
        <div class="point point-top" data-point="18"></div>
      </div>
      <div class="bar-col" data-bar>
        <div class="bar-stack" data-bar-color="white"></div>
        <div class="bar-stack" data-bar-color="black"></div>
      </div>
      <div class="quadrant top-right">
        <div class="point point-top" data-point="19"></div>
        <div class="point point-top" data-point="20"></div>
        <div class="point point-top" data-point="21"></div>
        <div class="point point-top" data-point="22"></div>
        <div class="point point-top" data-point="23"></div>
        <div class="point point-top" data-point="24"></div>
      </div>
      <div class="off-col" data-off>
        <div class="off-stack" data-off-color="white"></div>
        <div class="off-stack" data-off-color="black"></div>
      </div>

      <div class="quadrant bottom-left">
        <div class="point point-bottom" data-point="12"></div>
        <div class="point point-bottom" data-point="11"></div>
        <div class="point point-bottom" data-point="10"></div>
        <div class="point point-bottom" data-point="9"></div>
        <div class="point point-bottom" data-point="8"></div>
        <div class="point point-bottom" data-point="7"></div>
      </div>
      <div class="bar-col-spacer"></div>
      <div class="quadrant bottom-right">
        <div class="point point-bottom" data-point="6"></div>
        <div class="point point-bottom" data-point="5"></div>
        <div class="point point-bottom" data-point="4"></div>
        <div class="point point-bottom" data-point="3"></div>
        <div class="point point-bottom" data-point="2"></div>
        <div class="point point-bottom" data-point="1"></div>
      </div>
      <div class="off-col-spacer"></div>
    </div>

    <aside class="side-panel">
      <div class="dice-area" data-dice></div>

      <div class="opening-area" data-opening hidden>
        <p class="opening-copy" data-opening-copy></p>
      </div>

      <div class="turn-info">
        <p data-turn-copy></p>
      </div>

      <div class="controls">
        <button type="button" data-action="roll">Roll</button>
        <button type="button" data-action="end-turn">End Turn</button>
        <button type="button" data-action="undo">Undo</button>
        <button type="button" data-action="rematch">Rematch</button>
        <span class="waiting-hint" data-waiting-hint hidden>Waiting for opponent&hellip;</span>
      </div>

      <div class="event-log" data-last-event></div>
    </aside>
  </main>

  <script>window.BACKGAMMON_WS = "wss://bg-demo-qp4pp767qjph46gw-8765.app.github.dev/ws";</script>
  <script src="game.js"></script>
</body>
</html>
